[workspace]
resolver = "2"
members = ["crates/core", "app", "crates/voice", "tools/release"]

[workspace.package]
version = "0.2.1"
edition = "2021"

[workspace.dependencies]
iroh = "1.4"
iroh-gossip = "0.101"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
anyhow = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
p2pcord-core = { path = "crates/core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
